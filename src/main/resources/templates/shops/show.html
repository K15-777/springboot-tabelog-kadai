<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <div th:replace="~{fragment :: meta}"></div>

    <div th:replace="~{fragment :: styles}"></div>

    <title>店舗詳細</title>
</head>

<body>
    <div class="nagoyameshi-wrapper">
        <!-- ヘッダー -->
        <div th:replace="~{fragment :: header}"></div>

        <main>
            <div class="container pt-4 pb-5 nagoyameshi-container">
                <div class="row justify-content-center">
                    <div class="col-xxl-9 col-xl-10 col-lg-11">
                        <nav class="mb-4" style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
                            <ol class="breadcrumb mb-0">
                                <li class="breadcrumb-item"><a th:href="@{/}">ホーム</a></li>
                                <li class="breadcrumb-item"><a th:href="@{/shops}">店舗一覧</a></li>
                                <li class="breadcrumb-item active" aria-current="page">店舗詳細</li>
                            </ol>
                        </nav>

                        <!-- お気に入りボタン（ログイン時かつ有料会員のみ表示） -->
                        <!-- isAuthenticated()だと管理者ログイン時にも真になりprincipal.userで例外になるため、一般会員限定(hasRole)にする -->
                        <div sec:authorize="hasRole('ROLE_GENERAL')" th:if="${#authentication.principal.user.subscriber}"
                            class="text-end mb-2">
                            <!-- 登録済みの場合（解除リンクとフォーム） -->
                            <div th:if="${isFavorite}">
                                <a href="javascript:void(0)"
                                    onclick="document.getElementById('favorite-delete-form').submit();">&#9829;
                                    お気に入り解除</a>
                                <form id="favorite-delete-form" class="d-none" method="post"
                                    th:action="@{/shops/__${shop.getId()}__/favorites/__${favorite.getId()}__/delete}">
                                </form>
                            </div>

                            <!-- 未登録の場合（追加リンクとフォーム） -->
                            <div th:unless="${isFavorite}">
                                <a href="javascript:void(0)"
                                    onclick="document.getElementById('favorite-create-form').submit();">&#9825;
                                    お気に入り追加</a>
                                <form id="favorite-create-form" class="d-none" method="post"
                                    th:action="@{/shops/__${shop.getId()}__/favorites/create}"></form>
                            </div>
                        </div>


                        <h1 class="mb-4 text-center" th:text="${shop.getName()}"></h1>

                        <div th:if="${errorMessage}" class="alert alert-danger">
                            <span th:text="${errorMessage}"></span>
                        </div>

                        <div class="mb-4">
                            <img th:if="${shop.getImageName()}" th:src="@{/storage/__${shop.getImageName()}__}"
                                class="w-100" alt="店舗画像">
                            <img th:unless="${shop.getImageName()}" th:src="@{/images/noImage.png}" class="w-100"
                                alt="NO IMAGE">
                        </div>

                        <div class="container">
                            <div class="row">
                                <div class="col-lg-8 container mb-4">
                                    <div class="row pb-2 mb-2 border-bottom">
                                        <div class="col-4">
                                            <span class="fw-bold">店舗名</span>
                                        </div>

                                        <div class="col">
                                            <span th:text="${shop.getName()}"></span>
                                        </div>
                                    </div>

                                    <div class="row pb-2 mb-2 border-bottom">
                                        <div class="col-4">
                                            <span class="fw-bold">説明</span>
                                        </div>

                                        <div class="col">
                                            <span class="nagoyameshi-pre-wrap"
                                                th:text="${shop.getDescription()}"></span>
                                        </div>
                                    </div>

                                    <div class="row pb-2 mb-2 border-bottom">
                                        <div class="col-4">
                                            <span class="fw-bold">下限価格</span>
                                        </div>

                                        <div class="col">
                                            <span
                                                th:text="${#numbers.formatInteger(shop.getLowestPrice(), 1, 'COMMA') + '円'}"></span>
                                        </div>
                                    </div>

                                    <div class="row pb-2 mb-2 border-bottom">
                                        <div class="col-4">
                                            <span class="fw-bold">上限価格</span>
                                        </div>

                                        <div class="col">
                                            <span
                                                th:text="${#numbers.formatInteger(shop.getHighestPrice(), 1, 'COMMA') + '円'}"></span>
                                        </div>
                                    </div>

                                    <div class="row pb-2 mb-2 border-bottom">
                                        <div class="col-4">
                                            <span class="fw-bold">定員</span>
                                        </div>

                                        <div class="col">
                                            <span th:text="${shop.getSeatingCapacity() + '人'}"></span>
                                        </div>
                                    </div>

                                    <div class="row pb-2 mb-2 border-bottom">
                                        <div class="col-4">
                                            <span class="fw-bold">住所</span>
                                        </div>

                                        <div class="col">
                                            <span th:text="${shop.getAddress()}"></span>
                                        </div>
                                    </div>

                                    <div class="row pb-2 mb-2 border-bottom">
                                        <div class="col-4">
                                            <span class="fw-bold">営業時間</span>
                                        </div>

                                        <div class="col">
                                            <span
                                                th:text="${#temporals.format(shop.getOpeningTime(), 'HH:mm') + ' 〜 ' + #temporals.format(shop.getClosingTime(), 'HH:mm')}"></span>
                                        </div>
                                    </div>

                                </div>

                                <!-- 未ログインの場合：ログインを促す -->
                                <div sec:authorize="isAnonymous()" class="col-lg-4 px-0 ps-lg-4 mb-4">
                                    <div class="card">
                                        <div class="card-body">
                                            <p class="card-text">予約するには<a th:href="@{/login}">ログイン</a>が必要です。</p>
                                            <button type="submit" class="btn text-white shadow-sm w-100 nagoyameshi-btn"
                                                disabled>予約する</button>
                                        </div>
                                    </div>
                                </div>

                                <!-- 2. ログイン済み（一般会員）の場合 -->
                                <!-- isAuthenticated()だと管理者ログイン時にも真になりprincipal.userで例外になるため、一般会員限定(hasRole)にする -->
                                <div sec:authorize="hasRole('ROLE_GENERAL')" class="col-lg-4 px-0 ps-lg-4 mb-4">
                                    <!-- 2-A. 有料会員（subscriber == true）：予約フォームを表示 -->
                                    <div th:if="${#authentication.principal.user.subscriber}" class="card">
                                        <div class="card-body">
                                            <form method="get"
                                                th:action="@{/shops/__${shop.getId()}__/reservations/input}"
                                                th:object="${reservationInputForm}">
                                                <div class="form-group mb-2">
                                                    <label for="reservationDate"
                                                        class="col-form-label text-md-left fw-bold">予約日</label>
                                                    <div th:if="${#fields.hasErrors('reservationDate')}"
                                                        class="text-danger small mb-2" th:errors="*{reservationDate}">
                                                    </div>
                                                    <input type="date" class="form-control"
                                                        th:field="*{reservationDate}">
                                                </div>

                                                <div class="form-group mb-2">
                                                    <label for="fromCheckinTime"
                                                        class="col-form-label text-md-left fw-bold">予約時間</label>
                                                    <div th:if="${#fields.hasErrors('fromCheckinTime')}"
                                                        class="text-danger small mb-2" th:errors="*{fromCheckinTime}">
                                                    </div>
                                                    <input type="time" class="form-control"
                                                        th:field="*{fromCheckinTime}" step="1800">
                                                </div>

                                                <div class="form-group mb-4">
                                                    <label for="numberOfPeople"
                                                        class="col-form-label text-md-left fw-bold">予約人数</label>
                                                    <div th:if="${#fields.hasErrors('numberOfPeople')}"
                                                        class="text-danger small mb-2" th:errors="*{numberOfPeople}">
                                                    </div>
                                                    <input type="number" class="form-control"
                                                        th:field="*{numberOfPeople}" min="1">
                                                </div>

                                                <div class="form-group">
                                                    <button type="submit"
                                                        class="btn text-white shadow-sm w-100 nagoyameshi-btn">予約する</button>
                                                </div>
                                            </form>
                                        </div>
                                    </div>

                                    <!-- 2-B. 無料会員（subscriber == false または null）：有料登録を促す -->
                                    <div th:unless="${#authentication.principal.user.subscriber}" class="card">
                                        <div class="card-body">
                                            <p class="card-text">予約するには<a th:href="@{#}">有料会員登録</a>が必要です。</p>
                                            <button type="button" class="btn text-white shadow-sm w-100 nagoyameshi-btn"
                                                disabled>予約する</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- レビューセクション -->
                        <div class="container px-0">
                            <h2 class="mb-4 text-center">レビュー</h2>

                            <!-- 有料会員かつ未投稿の場合のみ投稿ボタンを表示 -->
                            <!-- isAuthenticated()だと管理者ログイン時にも真になりprincipal.userで例外になるため、一般会員限定(hasRole)にする -->
                            <div sec:authorize="hasRole('ROLE_GENERAL')"
                                th:if="${#authentication.principal.user.subscriber && !hasUserReviewed}"
                                class="text-center mb-4">
                                <a th:href="@{/shops/__${shop.getId()}__/reviews/register}"
                                    class="btn text-white shadow-sm px-5 nagoyameshi-btn">レビューを投稿する</a>
                            </div>

                            <div th:if="${#lists.isEmpty(reviewList)}" class="text-center mb-4">
                                <p>まだレビューがありません。</p>
                            </div>

                            <div th:unless="${#lists.isEmpty(reviewList)}"
                                class="row row-cols-1 row-cols-md-2 g-4 mb-4">
                                <div th:each="review : ${reviewList}" class="col">
                                    <div class="card h-100">
                                        <div class="card-body">
                                            <div class="d-flex justify-content-between align-items-center mb-2">
                                                <h5 class="card-title mb-0" th:text="${review.getUser().getName()}">
                                                </h5>

                                                <!-- ログイン中の本人にのみ編集・削除を表示 -->
                                                <!-- isAuthenticated()だと管理者ログイン時にも真になりprincipal.userで例外になるため、一般会員限定(hasRole)にする -->
                                                <div sec:authorize="hasRole('ROLE_GENERAL')"
                                                    th:if="${#authentication.principal.user.id == review.getUser().getId()}">
                                                    <a th:href="@{/shops/__${shop.getId()}__/reviews/__${review.getId()}__/edit}"
                                                        class="me-2">編集</a>
                                                    <a href="#" class="nagoyameshi-link-danger" data-bs-toggle="modal"
                                                        th:data-bs-target="${'#deleteReviewModal' + review.getId()}">削除</a>

                                                    <!-- 削除用モーダル -->
                                                    <div class="modal fade"
                                                        th:id="${'deleteReviewModal' + review.getId()}" tabindex="-1"
                                                        th:aria-labelledby="${'deleteReviewModalLabel' + review.getId()}">
                                                        <div class="modal-dialog">
                                                            <div class="modal-content">
                                                                <div class="modal-header">
                                                                    <h5 class="modal-title"
                                                                        th:id="${'deleteReviewModalLabel' + review.getId()}"
                                                                        th:text="${shop.getName() + 'のレビューを削除してもよろしいですか？'}">
                                                                    </h5>
                                                                    <button type="button" class="btn-close"
                                                                        data-bs-dismiss="modal"
                                                                        aria-label="閉じる"></button>
                                                                </div>
                                                                <div class="modal-footer">
                                                                    <form method="post"
                                                                        th:action="@{/shops/__${shop.getId()}__/reviews/__${review.getId()}__/delete}">
                                                                        <button type="submit"
                                                                            class="btn nagoyameshi-btn-danger text-white shadow-sm">削除</button>
                                                                    </form>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            <p class="card-text mb-1">
                                                <span class="text-warning">
                                                    <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                                                        <span th:if="${i <= review.getRating()}">&#9733;</span>
                                                        <span th:unless="${i <= review.getRating()}">&#9734;</span>
                                                    </th:block>
                                                </span>
                                            </p>
                                            <p class="card-text text-muted small"
                                                th:text="${#dates.format(review.getCreatedAt(), 'yyyy年MM月dd日')}">
                                            </p>
                                            <p class="card-text" th:text="${review.getComment()}"></p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div th:unless="${#lists.isEmpty(reviewList)}" class="text-center mb-4">
                                <a th:href="@{/shops/__${shop.getId()}__/reviews}">すべてのレビューを見る</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- フッター -->
        <div th:replace="~{fragment :: footer}"></div>
    </div>

    <div th:replace="~{fragment :: scripts}"></div>
</body>

</html>
